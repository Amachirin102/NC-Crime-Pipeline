name: monthly-pipeline

# Manual only. The city's GIS server sits behind an F5 web firewall that
# appears to refuse GitHub's cloud runners (run #1 failed in the pull step;
# the same command passes from a residential connection). To automate, run
# this on a self-hosted runner or a local scheduled task, then restore:
#   schedule:
#     - cron: "0 12 5 * *"     # 5th of each month, 12:00 UTC
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Pull, audit, diff, publish
        id: pipeline
        run: python -m civicpipe run --since 2022-01-01
      - name: Commit published output
        if: success()
        run: |
          git config user.name  "civicpipe-bot"
          git config user.email "civicpipe-bot@users.noreply.github.com"
          git add output data/snapshots data/raw/**/manifest.json
          git commit -m "Monthly run $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
      - name: Keep audit evidence when a gate fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-audit-${{ github.run_id }}
          path: output/
